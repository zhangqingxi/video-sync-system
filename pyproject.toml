[project]
name = "video-sync-system"
version = "3.0.0"
description = "企业级视频数据同步系统 - 支持AWS S3/阿里云OSS云存储和站点数据同步"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Qasim", email = "1575078379l@163.com" }]
keywords = ["video-sync", "aws-s3", "aliyun-oss", "data-synchronization"]

# 运行时依赖
dependencies = [
    "requests>=2.32.3,<2.33",
    "mysql-connector-python>=9.1.0,<10.0",
    "urllib3>=2.2.3,<2.3",
    "boto3>=1.35.76,<1.36",
    "botocore>=1.35.76,<1.36",
    "alibabacloud-oss-v2>=1.2.1,<2.0",
    "pycryptodome>=3.21.0,<4.0",
    "pyyaml>=6.0.2,<7.0",
]

# 开发依赖（可选安装）
[project.optional-dependencies]
dev = [
    "mypy>=1.13.0,<2.0",
    "types-requests>=2.32.0,<3.0",
    "types-PyYAML>=6.0.12,<7.0",
    "black>=24.10.0,<25.0",
    "flake8>=7.1.1,<8.0",
    "isort>=5.13.2,<6.0",
    "pytest>=8.3.4,<9.0",
    "pytest-cov>=6.0.0,<7.0",
]

[project.urls]
Repository = "https://github.com/zhangqingxi/video-sync-system"

# ==================== 工具配置 ====================

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["src"]
known_third_party = ["boto3", "mysql", "requests", "alibabacloud_oss_v2"]

[tool.flake8]
max-line-length = 88
extend-ignore = "E203, E501, W503"
exclude = [".git", "__pycache__", "build", "dist", ".venv", "venv"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short", "--cov=src", "--cov-report=term-missing"]
